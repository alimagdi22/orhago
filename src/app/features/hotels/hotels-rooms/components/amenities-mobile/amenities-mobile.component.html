<div class="amenities-card p-3 shadow-sm rounded-4">
  <h4 class="fw-bold mb-3">Amenities</h4>

  <div class="row g-2 section">
    <div class="col-md-6" *ngFor="let item of hotelRoomsService.roomsData.Amenities.slice(0,6)">
      <div class="amenity-box d-flex align-items-center">
        <span class="me-2">✔️</span>
        <span>{{ item.Amenity }}</span>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a (click)="openDialog()" class="text-success fw-semibold">View more amenities</a>
  </div>
</div>

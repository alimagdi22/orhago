<form [formGroup]="hotelResults.filterForm">
  <ng-container formArrayName="hotelRates" *ngIf="!hotelResults.hotelResultsLoader">
    <div class="rate-chip-wrapper">
      <ng-container *ngFor="let item of hotelResults.hotelRatesArray.controls; let i = index">
        <ng-container [formGroupName]="i">
          <label class="rate-chip" [class.active]="item.get('rate')?.value">
            <input
              formControlName="rate"
              type="checkbox"
              (click)="hotelResults.selectHotelRates(i)"
              hidden
            />
            <span class="star-label">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#FFD700">
                <path d="M12 .587l3.668 7.568L24 9.75l-6 5.845 1.416 8.263L12 18.896l-7.416 4.962L6 15.595 0 9.75l8.332-1.595z"/>
              </svg>
              {{ i + 1 }}
            </span>
          </label>
        </ng-container>
      </ng-container>
    </div>
  </ng-container>
</form>

@if (hotelResults.filterForm) {
  <form [formGroup]="hotelResults.filterForm" class="name-search-form">
    <div class="input-wrapper position-relative">
      <input
        formControlName="hotelName"
        type="text"
        placeholder="{{ 'hotels-filter.PropertySearch' | translate }}"
        class="form-control search-input"
        (input)="triggerFilter()"
      />
      <i class="bi bi-search search-icon"></i>
    </div>
  </form>
}

<div class="wrapper">
  <app-secondary-button
    [secondaryButtonInfo]="processToPayment"
    [title]="('checkout.processToPayment' | translate) + ': ' + (fareAmount | exchange: 'value': fareCurrency | arabicNumber) + ' ' + (fareCurrency | exchange: 'code' | currencyLabel)"
    (clickSecondaryButton)="onClick(false)"
    [mobileStyles]="{
      width: '296px',
      borderRadius: '8px',
      fontSize:'16px',
      padding:'5px'
    }"
  />

  @if(flightCheckoutService.organizedOfllineServices.length) {
    <app-main-button
      [mainButtonInfo]="payWithServiceButton"
      [title]="('checkout.payWithWhatsapp' | translate) + ' ' + ((flightCheckoutService.organizedOfllineServices[2].currency | exchange: 'code' | currencyLabel) + ' ' + (flightCheckoutService.organizedOfllineServices[2].servicePrice | exchange: 'value': flightCheckoutService.organizedOfllineServices[2].currency | arabicNumber))"
      (clickMainButton)="onClick(true)"
      [mobileStyles]="{
        fontSize:'15px'
      }"
    />
  }
</div>

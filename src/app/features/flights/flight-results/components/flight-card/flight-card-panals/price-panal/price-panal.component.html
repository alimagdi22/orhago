<div class="price-panal">
  <div class="price-panal__copy">
    <p class="price-panal__price">
      {{ airItinerary.itinTotalFare.currencyCode | exchange: 'code' }}
      {{ airItinerary.itinTotalFare.amount | exchange: 'value' }}
    </p>
    @if (airItinerary.cabinClass) {
      <p class="price-panal__fare">{{ airItinerary.cabinClass }}</p>
    }
  </div>

  <button
    type="button"
    class="select-btn"
    [disabled]="isSelectedButtonLoading || flightResultService.isBrandedFaresLoading"
    (click)="onClickSelect()"
  >
    @if (isSelectedButtonLoading) {
      <span>...</span>
    } @else {
      <span>{{ 'results.card.select' | translate }}</span>
    }
  </button>
</div>

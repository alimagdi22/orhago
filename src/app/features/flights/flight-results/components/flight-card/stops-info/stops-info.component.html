<section class="timeline">
  <p class="timeline__duration">{{ durationLabel }}</p>
  <div class="timeline__track">
    <span class="timeline__dot"></span>
    <span class="timeline__line"></span>
    <span class="timeline__line"></span>
    <span class="timeline__dot"></span>
  </div>
  <span class="timeline__pill">
    @if (flight.stopsNum === 0) {
      {{ 'results.filter.Non-Stop' | translate }}
    } @else if (flight.stopsNum === 1) {
      <span>{{ 'results.filter.1 Stop' | translate }}</span>
      @if (viaCode) {
        <span> · {{ viaCode }}</span>
      }
    } @else {
      {{ flight.stopsNum }} {{ 'results.filter.stops' | translate }}
    }
  </span>
</section>

<section class="main-info-wrapper">
  <img
    [src]="flight.flightAirline.airlineLogo"
    [alt]="flight.flightAirline.airlineName"
    class="airline-logo"
  />

  <div class="info-text">
    <h3 class="destinations-text">
      {{ flight.flightDTO[0].departureTerminalAirport.cityCode }} -
      {{ flight.flightDTO[flight.flightDTO.length - 1].arrivalTerminalAirport.cityCode }}
    </h3>
    <p class="airline-name-text">{{ flight.flightAirline.airlineName }}</p>
    <p class="duration-text">{{ totalDuration | hourminute }}</p>
  </div>
</section>

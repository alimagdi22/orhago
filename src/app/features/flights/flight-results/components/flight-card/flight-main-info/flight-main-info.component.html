<section class="airline">
  <span class="airline__mark airline__code">
    <img class="w-100 h-100" [src]="flight.flightAirline.airlineLogo" [alt]="flight.flightAirline.airlineName" />
  </span>
  <span class="airline__copy">
    <span class="airline__name">{{ flight.flightAirline.airlineName }}</span>
    @if (flightNo) {
      <span class="airline__meta">
        {{ flightNo }}
        @if (equipment) {
          <span class="airline__equip"> · {{ equipment }}</span>
        }
      </span>
    }
  </span>
</section>

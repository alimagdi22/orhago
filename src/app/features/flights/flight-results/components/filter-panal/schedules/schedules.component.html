<div class="wrapper">
  <p class="schedule-kicker">
    @if (flightTypeIndex === 0) {
      {{ 'results.filter.departureFrom' | translate }} {{ originCode }}
    } @else {
      {{ 'results.filter.arrivalAt' | translate }} {{ destinationCode }}
    }
  </p>

  <app-schedule-tab (scheduleTabChange)="onScheduleTabChange($event)" />

  <div class="options">
    <app-schedule-option
      *ngFor="let scheduleOption of scheduleOptions"
      [scheduleOption]="scheduleOption"
      (click)="onSelectOption(scheduleOption)"
    />
  </div>
</div>

<div class="wrapper">
  <button class="filter-btn" type="button" (click)="toggleSidebar()">
    <img src="assets/images/Vector.svg" alt="filter icon" />
  </button>

  @for (sortItem of sortItems; track sortItem.title; let i = $index) {
    <app-sorting-item-app
      [sortItem]="sortItem"
      (click)="onClickSort(sortItem)"
    />
  }
</div>

@if (isSidebarOpen) {
  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
}
<aside class="mobile-sidebar-panel d-lg-none" [class.open]="isSidebarOpen">
  <app-filter-panal (click)="filterUpdated()" />
</aside>

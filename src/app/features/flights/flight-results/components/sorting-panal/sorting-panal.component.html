<div class="sort-board">
  <div class="sort-cards">
    @for (sortItem of cardItems; track sortItem.title) {
      <app-sort-item [sortItem]="sortItem" (click)="onClickSort(sortItem)" />
    }
  </div>

  <div class="sort-foot">
    <p>
      {{ flightResultService.response?.airItineraries.length }}
      {{ 'results.sort.flights' | translate }}
      <span aria-hidden="true"> · </span>
      {{ 'results.sort.taxes' | translate }}
    </p>

    <div class="sort-menu">
      <button type="button" class="sort-menu__button" (click)="toggleMenu($event)">
        <span>{{ 'results.sort.label' | translate }} {{ ('results.sort.' + activeItem.title) | translate }}</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.2 4.2 6 8l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      @if (menuOpen) {
        <ul class="sort-menu__list">
          @for (sortItem of sortItems; track sortItem.title) {
            <li>
              <button
                type="button"
                [class.is-current]="sortItem.isActive"
                (click)="onClickSort(sortItem); $event.stopPropagation()"
              >
                {{ 'results.sort.' + sortItem.title | translate }}
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </div>
</div>

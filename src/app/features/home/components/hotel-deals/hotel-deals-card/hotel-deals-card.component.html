<article class="fare-card">
  <div class="fare-card__media">
    <img
      [src]="deal?.image || image || 'assets/images/hotels/hotel-replacement.webp'"
      (error)="$any($event.target).src = 'assets/images/hotels/hotel-replacement.webp'"
      [alt]="deal?.name || 'Hotel'"
      [title]="deal?.name || 'Hotel Photo'"
    />
  </div>

  <div class="fare-card__body">
    <h3 class="fare-card__title">{{ deal?.name }}</h3>
    @if (deal?.location) {
      <p class="fare-card__meta">{{ deal?.location }}</p>
    }
    <p class="fare-card__price">
      {{ 'home.fareCard.from' | translate }}
      <strong>{{ deal?.price }}</strong>
    </p>
  </div>
</article>

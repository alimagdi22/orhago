<div class="hotel-deals-container" [dir]="translate.currentLang === 'ar' ? 'rtl' : 'ltr'">
  <div class="text-wrapper">
    <h2 class="title">{{ 'home.hotelDeals.title' | translate }}</h2>
    <p class="description">{{ 'home.hotelDeals.description' | translate }}</p>
  </div>

  <div class="deals-grid">
    @for (deal of currentDeals; track $index) {
      <div class="grid-item">
        <app-hotel-deals-card [deal]="deal"></app-hotel-deals-card>
      </div>
    }
  </div>

  <div class="pagination-wrapper">
    <button
      type="button"
      class="nav-btn prev-btn"
      [disabled]="currentPage === 1"
      (click)="prevPage()"
      [attr.aria-label]="'checkout.previous' | translate"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14.5 6.5L9 12l5.5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="page-numbers">
      @for (page of pages; track page) {
        <span
          class="page-num"
          [class.active]="page === currentPage"
          (click)="setPage(page)"
        >
          {{ page }}
        </span>
      }
    </div>

    <button
      type="button"
      class="nav-btn next-btn"
      [disabled]="currentPage === totalPages"
      (click)="nextPage()"
      [attr.aria-label]="'checkout.next' | translate"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</div>

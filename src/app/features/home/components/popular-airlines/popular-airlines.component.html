@if (isLoading) {
  <div class="airline-grid">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track $index) {
      <div class="airline-skeleton">
        <app-skeleton-loader height="56px" borderRadius="12px" />
      </div>
    }
  </div>
} @else {
  <div class="airline-grid">
    @for (airline of popularAirlines; track $index) {
      <button type="button" class="airline-card-btn" (click)="navigateToAirline(airline.slug)">
        <div class="airline-logo-box">
          <img [src]="airline.airlineLogo" [alt]="getAirlineName(airline)" [title]="getAirlineName(airline)" />
        </div>
        <span class="airline-name-text">{{ getAirlineName(airline) }}</span>
      </button>
    }
  </div>
}

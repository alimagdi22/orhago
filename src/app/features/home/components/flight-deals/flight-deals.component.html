<section class="popular">
  <div class="section-head">
    <div>
      <h2>{{ 'home.flightDeals.title' | translate }}</h2>
      <p>{{ 'home.flightDeals.description' | translate }}</p>
    </div>
    <a class="section-head__link" routerLink="/flights">
      <span class="section-head__link-wide">{{ 'home.fareCard.seeAllRoutes' | translate }}</span>
      <span class="section-head__link-short">{{ 'home.fareCard.seeAll' | translate }}</span>
      <span aria-hidden="true"> ›</span>
    </a>
  </div>

  <div class="route-grid">
    @for (flight of flights; track flight.flightKey) {
      <app-flight-deals-card [mostSearchedFlight]="flight" />
    }
  </div>
</section>

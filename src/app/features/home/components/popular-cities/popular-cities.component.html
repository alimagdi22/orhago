<div class="city-grid">
  @for (card of cards; track $index) {
    <button type="button" class="city-card-btn" (click)="onSelectCity(card.cityName)">
      <div class="city-img-box">
        <img [src]="'assets/images/popular/' + card.image" [alt]="card.cityName" [title]="card.cityName" />
      </div>
      <span class="city-name-text">{{ card.cityName }}</span>
    </button>
  }
</div>

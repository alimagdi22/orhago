<header class="search-box-header">
  <ul class="search-box-header__list">
    @for (tab of tabs; track tab.index) {
      <li
        class="search-box-header__list__item"
        [class.active]="activeIndex === tab.index"
        (click)="onClickTab(tab.index)"
      >
        <span>{{ tab.label | translate }}</span>
      </li>
    }
  </ul>
</header>

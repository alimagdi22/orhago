<div class="search-box-wrapper">
  @if (!isFlightResults && !isHotelResults) {
    <app-search-box-header (tabChanged)="onTabChanged($event)" />
  }

  @if (isFlightResults || (!isHotelResults && tabIndex === 0)) {
    <app-flight-search-box [airlineLogo]="airlineLogo" />
  } @else if (isHotelResults || tabIndex === 1) {
    <app-hotel-search-box />
  } @else {
    <p class="search-placeholder">{{ 'home.search.comingSoon' | translate }}</p>
  }
</div>

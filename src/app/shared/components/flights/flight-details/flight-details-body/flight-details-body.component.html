<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  @for (link of links; track link.id) {
    <a mat-tab-link (click)="activeLink = link" [active]="activeLink === link">
      {{ 'flightDetails.headers.' + link.title | translate }}
    </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel>
  @switch (activeLink.id) {
    @case ('tab1') {
      <div>
        <app-itinerary />
      </div>
    }
    @case ('tab2') {
      <div>
        <app-fare-rules />
      </div>
    }
    @case ('tab3') {
      <div>
        <app-baggage-details />
      </div>
    }
  }
</mat-tab-nav-panel>
